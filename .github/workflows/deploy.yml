# Deploys the built site to the VPS over SSH.  ← Path A (GitHub Actions)
#
# How it works:
#   1. On every push to `main` (and manually via the "Run workflow" button),
#      GitHub checks out the repo on an ubuntu runner and runs
#      `npm ci && npm run build`, producing `dist/`.
#   2. The runner logs into the VPS over SSH and rsyncs `dist/` into the web
#      root that nginx serves for marcxime.com.
#   3. nginx picks up the new files (no reload needed for static files).
#
# ⚠️ One-time VPS prep (the SSH user must be able to write the web root):
#     sudo mkdir -p /var/www/marcxime
#     sudo chown -R marc:marc /var/www/marcxime
#
# Secrets required (repo  →  Settings  →  Secrets and variables  →  Actions):
#   VPS_USER     = marc
#   VPS_HOST     = 46.62.196.199        (public IPv4, reachable on port 22)
#   VPS_PORT     = 22
#   VPS_SSH_KEY  = SSH PRIVATE key; its public half MUST be in the deploy
#                  user's ~/.ssh/authorized_keys on the VPS
#   VPS_WEBROOT  = /var/www/marcxime
#
# For the "clone + build on the VPS instead" alternative, see DEPLOY-GUIDE.md
# (Path B) — useful when you want to avoid a CI service entirely.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy static files to VPS
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.VPS_SSH_KEY }}" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSH_CMD="ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=accept-new"
          WEBROOT="${{ secrets.VPS_WEBROOT }}"

          rsync -avz --delete -e "$SSH_CMD" dist/ "$SSH_TARGET":"$WEBROOT"/
